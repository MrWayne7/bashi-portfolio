<style>
.app{max-width:900px;margin:0 auto;padding:clamp(20px,5vw,60px) var(--pad) 90px}
.apph{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:clamp(28px,6vw,60px)}
.apph .k{font-family:var(--mono);font-size:13px;color:var(--dim);text-align:right}
.app h1{font-size:clamp(36px,7vw,76px);line-height:1;letter-spacing:-.01em}
.app h1 span{color:var(--green)}
.app h2{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:400;margin:clamp(30px,5vw,46px) 0 12px}
.app .lead{color:var(--dim-2);font-size:clamp(17px,1.7vw,20px);max-width:62ch;margin-top:16px;white-space:pre-line}
.app ul.l{list-style:none}.app ul.l li{padding:11px 0;border-top:1px solid var(--line)}
.app ul.l li::before{content:"→ ";color:var(--green)}
.price{display:grid;grid-template-columns:1fr auto;gap:8px 20px;border:1px solid var(--line);background:var(--bg-2);padding:clamp(18px,3vw,30px);align-items:baseline}
.price .big{font-size:clamp(32px,5vw,52px);font-weight:700;line-height:1}
.price span{color:var(--dim)}
.estado{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--green);color:var(--green-ink);padding:4px 10px}
.ok{border:1px solid var(--green);padding:20px;margin-top:18px}
.fases{list-style:none;counter-reset:f}
.fases li{position:relative;padding:0 0 22px 34px;border-left:1px solid var(--line);margin-left:9px}
.fases li:last-child{border-left-color:transparent}
.fases li::before{content:"";position:absolute;left:-10px;top:3px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--bg)}
.fases li.h::before{background:var(--green);border-color:var(--green)}
.fases li.a::before{border-color:var(--green);box-shadow:0 0 0 4px rgba(0,255,102,.15)}
.fases li b{display:block}.fases li span{font-family:var(--mono);font-size:13px;color:var(--dim)}
.ent{border:1px solid var(--line);background:var(--bg-2);margin-bottom:22px}
.ent .pl{aspect-ratio:16/9;background:#000;position:relative}.ent .pl>*{position:absolute;inset:0;width:100%;height:100%;border:0}
.ent .in{padding:16px clamp(14px,3vw,24px) 20px}
.ent h3{font-size:20px}.ent .m{font-family:var(--mono);font-size:13px;color:var(--dim)}
.coms{list-style:none;margin:14px 0}.coms li{padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.coms button{font-family:var(--mono);color:var(--green-ink);margin-right:8px}
.coms small{color:var(--dim);margin-left:6px}
.cform{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.cform .tm{font-family:var(--mono);border:1px solid var(--line);padding:0 12px;display:flex;align-items:center;min-width:76px;justify-content:center}
.cform input{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;padding:11px 12px}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pays div{border:1px solid var(--line);padding:14px}.pays b{display:block;font-size:22px}.pays span{font-family:var(--mono);font-size:12px;color:var(--dim)}
.bar2{height:6px;background:var(--line);margin-top:12px}.bar2 i{display:block;height:100%;background:var(--green)}
.err404{padding:20vh 0;text-align:center;color:var(--dim)}
@media (max-width:600px){.pays{grid-template-columns:1fr}.price{grid-template-columns:1fr}}
@media print{.noprint,.wafab{display:none!important}body{background:#fff;color:#111}.price,.ent{background:#fff}}
</style>
<body><main class="app" id="app">
<div class="apph"><a class="wm" href="/" aria-label="BASHI">BASHI<span aria-hidden="true">_</span></a><div class="k" id="k">Propuesta</div></div>
<div id="c"><p class="err404">Cargando…</p></div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)},esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var id=(location.pathname.split('/')[2]||new URLSearchParams(location.search).get('id')||'').replace(/[^a-z0-9]/g,'');
var fmt=function(d){return d?new Date(d+(d.length===10?'T12:00':'')).toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'}):''};
var li=function(a){return '<ul class="l">'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'};
function pinta(p){
  document.title=(p.titulo||'Propuesta')+' · '+p.cliente+' · BASHI';
  $('k').innerHTML='Propuesta N.º '+esc(p.id.toUpperCase())+'<br>'+fmt(p.creada.slice(0,10));
  var venc=p.valida&&p.valida<new Date().toISOString().slice(0,10)&&p.estado!=='aceptada';
  var h='<p class="estado">'+(p.estado==='aceptada'?'Aceptada':(venc?'Vencida':'Para '+esc(p.cliente)))+'</p>'+
   '<h1 style="margin-top:18px">'+esc(p.titulo||p.servicio||'Propuesta')+'<span>_</span></h1>'+(p.intro?'<p class="lead">'+esc(p.intro)+'</p>':'');
  if(p.alcance.length)h+='<h2>Qué vamos a hacer</h2>'+li(p.alcance);
  if(p.entregables.length)h+='<h2>Qué recibes</h2>'+li(p.entregables);
  if(p.cronograma.length)h+='<h2>Tiempos</h2>'+li(p.cronograma);
  h+='<h2>Inversión</h2><div class="price"><div><div class="big">'+esc(p.precio)+'</div>'+(p.anticipo?'<span>Anticipo del '+p.anticipo+'% para apartar la fecha · el resto al entregar</span>':'')+'</div>'+(p.valida?'<span>Válida hasta el '+fmt(p.valida)+'</span>':'')+'</div>';
  if(p.estado==='aceptada'){
    h+='<div class="ok"><b>Propuesta aceptada por '+esc(p.acepto.nombre)+'</b> el '+fmt(p.acepto.t.slice(0,10))+'. ¡Arrancamos!'+(p.pago?'<p style="margin-top:14px"><a class="btn" href="'+esc(p.pago)+'" target="_blank" rel="noopener">Pagar el anticipo</a></p>':'<p style="margin-top:8px;color:var(--dim-2)">Te escribo por WhatsApp con los siguientes pasos.</p>')+'</div>';
  } else if(!venc){
    h+='<h2>¿Arrancamos?</h2><form class="form noprint" id="acc" novalidate style="max-width:none"><div><label for="a-n">Escribe tu nombre para aceptar</label><input id="a-n" autocomplete="name" maxlength="80"></div>'+
     '<div class="hp" aria-hidden="true"><label for="a-w">No</label><input id="a-w" tabindex="-1" autocomplete="off"></div>'+
     '<label class="chk"><input type="checkbox" id="a-ok"><span>Acepto esta propuesta: el alcance, los tiempos y la inversión.</span></label>'+
     '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="submit">Acepto la propuesta</button><a class="btn ghost" href="https://wa.me/573245026518?text='+encodeURIComponent('Hola BASHI, tengo una pregunta sobre la propuesta '+p.id.toUpperCase())+'" target="_blank" rel="noopener">Tengo una pregunta</a></div><p class="msg" role="status" aria-live="polite"></p></form>';
  } else h+='<p style="margin-top:18px;color:var(--dim-2)">Esta propuesta venció. <a href="https://wa.me/573245026518" target="_blank" rel="noopener">Escríbeme</a> y la actualizamos.</p>';
  h+='<p class="noprint" style="margin-top:40px"><button class="btn ghost" type="button" onclick="window.print()">Guardar en PDF</button></p>'+
   '<p style="margin-top:40px;color:var(--dim);font-size:14px">BASHI · Director, editor y fotógrafo · studiobashi.com · WhatsApp +57 324 502 6518</p>';
  $('c').innerHTML=h;
  var f=$('acc');if(f)f.addEventListener('submit',function(e){e.preventDefault();var m=f.querySelector('.msg'),n=$('a-n').value.trim();
    if(!n){m.className='msg err';m.textContent='Escribe tu nombre.';return;}
    if(!$('a-ok').checked){m.className='msg err';m.textContent='Marca la casilla para aceptar.';return;}
    m.className='msg';m.textContent='Enviando…';
    fetch('/api/prop/'+id,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({acepto:n,web:$('a-w').value})}).then(function(r){return r.json()}).then(function(o){if(o.prop)pinta(o.prop);else{m.className='msg err';m.textContent=o.error||'No se pudo.'}}).catch(function(){m.className='msg err';m.textContent='No se pudo enviar.'});
  });
}
if(!id){$('c').innerHTML='<p class="err404">Falta el código de la propuesta.</p>';return;}
fetch('/api/prop/'+id,{cache:'no-store'}).then(function(r){return r.json()}).then(function(p){if(p.error)throw 0;pinta(p)}).catch(function(){$('c').innerHTML='<p class="err404">No encontré esta propuesta. Revisa el link o escríbeme por WhatsApp.</p>'});
})();
</script>
</body></html>
